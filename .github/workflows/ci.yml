# Intégration continue Iris.
#
# Raison d'être : une branche a déjà été poussée sans que ni le front ni le back ne
# compile, parce que rien n'obligeait à lancer les commandes avant de committer. Ce
# workflow les lance à chaque poussée et à chaque pull request : une branche qui ne
# construit pas, ou dont un test échoue, ne peut plus être fusionnée sans que ce soit vu.
#
# Cinq travaux indépendants, pour que l'échec désigne tout de suite le coupable :
#   - compose   : gardes d'identifiants PostgreSQL et résolution de la stack ;
#   - backend   : génération Prisma + compilation TypeScript ;
#   - tests     : migrations et suite complète contre un vrai PostgreSQL 16 ;
#   - frontend  : compilation TypeScript stricte, build Vite et lint ;
#   - parcours  : parcours navigateur contre la SPA, l'API et PostgreSQL.
name: CI

# `push` est limité à main, `pull_request` couvre les branches de travail. Déclencher sur
# les deux pour toute branche lançait la série DEUX FOIS par commit dès qu'une pull request
# était ouverte : la clé de concurrence diffère entre un push (refs/heads/…) et une pull
# request (refs/pull/N/merge), les deux séries ne s'annulaient donc pas l'une l'autre.
#
# Conséquence assumée : une branche sans pull request n'est pas vérifiée. Elle le sera dès
# l'ouverture de la pull request, c'est-à-dire avant toute fusion — le moment qui compte.
on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée sur la même branche annule la série précédente : inutile de payer
# pour un code déjà remplacé.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker Compose — gardes PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose s'arrête à la PREMIÈRE interpolation fautive : une résolution qui
      # échoue ne détecte donc pas la perte d'un garde isolé, masquée par un autre.
      # Le contrôle structurel lit chaque interpolation : `:-` réinstalle un repli
      # et `${VAR}` nu se résout en chaîne vide avec un simple avertissement.
      - name: Interdire toute interpolation sans garde
        run: |
          mauvaises="$(grep -noE '\$\{[^}]*\}' docker-compose.yml | grep -vE '\$\{[A-Za-z_][A-Za-z0-9_]*:\?' || true)"
          if [ -n "$mauvaises" ]; then
            echo '::error::Une interpolation de docker-compose.yml ne porte pas de garde `:?`.'
            echo "$mauvaises"
            exit 1
          fi
      # `env_file` est requis par Compose mais ne doit jamais être commité : la CI
      # part donc du modèle et remplace son unique secret d'exemple avant inspection.
      - name: Préparer un environnement applicatif non secret
        run: |
          cp server/.env.example server/.env
          python3 -c "from pathlib import Path; p = Path('server/.env'); p.write_text(p.read_text().replace('CHANGE_ME_GENERATE_A_LONG_RANDOM_SECRET', 'ci_jwt_secret_not_for_production_0123456789'))"
      # Les trois identifiants PostgreSQL doivent être imposés par `:?`. Un repli
      # `${POSTGRES_PASSWORD:-...}` ferait repasser cette commande au vert.
      - name: Refuser les identifiants PostgreSQL absents
        run: |
          if docker compose --env-file /dev/null config > /dev/null 2>&1; then
            echo '::error::Docker Compose accepte des identifiants PostgreSQL absents.'
            exit 1
          fi
      # Avec les trois valeurs injectées, la configuration doit se résoudre et ne
      # doit contenir ni exemple ni ancien repli. La présence de `ci_secret` prouve
      # que le mot de passe provient bien de l'environnement de la CI.
      - name: Résoudre sans valeur d'exemple
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_secret
          POSTGRES_DB: ci
        run: |
          docker compose config > compose.resolved.yml
          if grep -Eq 'CHANGE_ME|iris_password' compose.resolved.yml; then
            echo '::error::Une valeur d’exemple ou un repli interdit est présent dans la configuration Compose.'
            exit 1
          fi
          grep -q 'POSTGRES_PASSWORD: ci_secret' compose.resolved.yml

  backend:
    name: Backend — compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      # `npm ci` et non `npm install` : il installe EXACTEMENT le lockfile et échoue si
      # package.json et package-lock.json divergent. C'est ce qui rend le build reproductible.
      - run: npm ci
      # URL factice : `prisma generate` n'ouvre aucune connexion, il lui faut seulement
      # une valeur syntaxiquement valide.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/iris?schema=public
      - run: npm run build

  tests:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_test
          POSTGRES_DB: iris_test
        ports: ['5432:5432']
        # Sans ce contrôle de santé, les tests démarrent avant que PostgreSQL n'accepte
        # les connexions et échouent pour une raison qui n'a rien à voir avec le code.
        options: >-
          --health-cmd "pg_isready -U iris -d iris_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://iris:iris_test@localhost:5432/iris_test?schema=public
      TEST_DATABASE_URL: postgresql://iris:iris_test@localhost:5432/iris_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Les migrations sont appliquées comme en production (`migrate deploy`) : une
      # migration écrite à la main mais invalide fait échouer la CI, pas le déploiement.
      - run: npx prisma migrate deploy
      # Vérifie que le schéma Prisma et les migrations décrivent bien la même base. Une
      # dérive silencieuse finit par faire supprimer un index à la migration suivante.
      - name: Dérive entre le schéma et les migrations
        run: |
          DIFF=$(npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script)
          echo "$DIFF"
          if ! echo "$DIFF" | grep -q "empty migration"; then
            echo "::error::Le schéma Prisma et les migrations ont divergé (voir le script ci-dessus)."
            exit 1
          fi
      # TEST_DATABASE_URL étant défini, les tests HTTP s'exécutent réellement au lieu
      # d'être ignorés.
      - run: npm test

  frontend:
    name: Frontend — build et lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # `npm run build` enchaîne `tsc -b` puis `vite build` : c'est exactement ce que fait
      # le Dockerfile, donc un build vert ici garantit une image constructible.
      - run: npm run build
      - run: npm run lint
      - run: npm run test:unit

  parcours:
    name: Frontend — parcours utilisateur
    runs-on: ubuntu-latest
    # Les tests API et jsdom ne reproduisent pas la saisie du navigateur : ce travail
    # pilote Chromium contre la SPA, le proxy Vite, le backend et PostgreSQL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_test
          POSTGRES_DB: iris_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U iris -d iris_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://iris:iris_test@localhost:5432/iris_e2e?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Backend — dépendances, schéma et compilation
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - name: Frontend — dépendances
        working-directory: client
        run: npm ci
      - name: Navigateur de test
        working-directory: client
        run: npx playwright install --with-deps chromium
      # playwright.config.ts démarre le backend compilé et Vite.
      - name: Parcours E2E
        working-directory: client
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parcours-rapport
          path: client/playwright-report/
          retention-days: 7
