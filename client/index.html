<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Icône de l'application, et non d'une société (lot P0) : source vectorielle public/icone.svg,
         rendue en PNG à chaque taille pour les navigateurs qui ne lisent pas le SVG. -->
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iPad/iPhone (Safari) : icône d'onglet + écran d'accueil, ignore les rel="icon" ci-dessus -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="apple-mobile-web-app-title" content="Iris" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iris</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
