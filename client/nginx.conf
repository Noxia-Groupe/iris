server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit JAMAIS être mis en cache : c'est lui qui référence le bundle JS
    # (nom haché, changeant à chaque build). S'il reste en cache navigateur/proxy après un
    # déploiement, l'utilisateur continue de charger l'ancien code (ex: ancien redirectUri
    # SSO) sans aucun moyen de le savoir. Les fichiers hachés dans /assets/, eux, peuvent
    # être mis en cache indéfiniment (leur nom change s'ils changent).
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # DNS interne de Docker : permet de re-résoudre l'IP du backend à chaque requête
    # (sinon nginx met en cache l'IP au démarrage et renvoie 502 si le backend est
    # recréé avec une nouvelle IP après un redéploiement).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirection vers le backend pour l'API
    location /api/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:3001$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pour les gros uploads (photos)
        client_max_body_size 20M;
    }

    # Redirection vers le backend pour les photos
    location /uploads/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:3001$request_uri;
        proxy_set_header Host $host;
    }
}
