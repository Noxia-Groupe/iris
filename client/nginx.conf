server {
    listen 80;

    # En-têtes de sécurité — définis au niveau `server` puis répétés explicitement dans
    # chaque `location` qui déclare son propre `add_header` (Cache-Control sur
    # /index.html) : nginx n'hérite les `add_header` du niveau parent QUE si le niveau
    # enfant n'en définit aucun lui-même. `always` garantit l'envoi même sur les réponses
    # d'erreur (401/403/404/5xx), y compris celles proxyfiées depuis le backend.
    #
    # Pas de Cross-Origin-Opener-Policy : le SSO Microsoft (MSAL popup + redirect bridge,
    # voir AuthCallbackMsal.tsx) dépend de la relation window.opener entre la popup et la
    # fenêtre d'origine ; un COOP strict casserait cette connexion (cf. commentaires MSAL).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://login.microsoftonline.com https://login.windows.net; frame-src https://login.microsoftonline.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit JAMAIS être mis en cache : c'est lui qui référence le bundle JS
    # (nom haché, changeant à chaque build). S'il reste en cache navigateur/proxy après un
    # déploiement, l'utilisateur continue de charger l'ancien code (ex: ancien redirectUri
    # SSO) sans aucun moyen de le savoir. Les fichiers hachés dans /assets/, eux, peuvent
    # être mis en cache indéfiniment (leur nom change s'ils changent).
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://login.microsoftonline.com https://login.windows.net; frame-src https://login.microsoftonline.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    }

    # DNS interne de Docker : permet de re-résoudre l'IP du backend à chaque requête
    # (sinon nginx met en cache l'IP au démarrage et renvoie 502 si le backend est
    # recréé avec une nouvelle IP après un redéploiement).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirection vers le backend pour l'API
    location /api/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:3001$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pour les gros uploads (photos)
        client_max_body_size 20M;
    }

    # Redirection vers le backend pour les photos
    location /uploads/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:3001$request_uri;
        proxy_set_header Host $host;
    }
}
