services:
  db:
    image: postgres:16-alpine
    container_name: iris_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER est obligatoire}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB est obligatoire}
    volumes:
      # Stockage persistant de la base PostgreSQL
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iris-network
      # Réseau partagé avec pgBackWeb pour les sauvegardes
      - backup-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER est obligatoire} -d ${POSTGRES_DB:?POSTGRES_DB est obligatoire}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: iris_backend
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      # URL de connexion construite à partir des identifiants obligatoires du service "db".
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER est obligatoire}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}@db:5432/${POSTGRES_DB:?POSTGRES_DB est obligatoire}?schema=public
    # Secrets applicatifs (JWT_SECRET obligatoire en prod, paramètres SSO et accès de secours).
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - iris-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: iris_frontend
    restart: always
    environment:
      - VITE_API_URL=/api
    networks:
      - iris-network
      # Réseau externe Nginx Proxy Manager
      - nginx-proxy
    # Nginx Proxy Manager pourra cibler ce conteneur (iris_frontend) sur le port 80

networks:
  iris-network:
    driver: bridge
  # Réseau géré par votre Nginx Proxy Manager Hostinger
  nginx-proxy:
    external: true
  # Réseau partagé avec pgBackWeb (autre stack Docker sur le même VPS)
  backup-net:
    external: true

volumes:
  postgres_data:
