version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: marge_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-marge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-marge_password}
      - POSTGRES_DB=${POSTGRES_DB:-marge}
    volumes:
      # Stockage persistant de la base PostgreSQL
      - postgres_data:/var/lib/postgresql/data
    networks:
      - noxia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marge} -d ${POSTGRES_DB:-marge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: marge_backend
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      # URL de connexion construite à partir des identifiants du service "db".
      - DATABASE_URL=postgresql://${POSTGRES_USER:-marge}:${POSTGRES_PASSWORD:-marge_password}@db:5432/${POSTGRES_DB:-marge}?schema=public
    # Secrets applicatifs (JWT_SECRET obligatoire en prod, GEMINI_API_KEY, ADMIN_*).
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Stockage persistant des photos (sur le disque VPS)
      - uploads_data:/app/uploads
    networks:
      - noxia-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: marge_frontend
    restart: always
    environment:
      - VITE_API_URL=/api
    networks:
      - noxia-network
      # Réseau externe Nginx Proxy Manager
      - nginx-proxy
    # Nginx Proxy Manager pourra cibler ce conteneur (marge_frontend) sur le port 80

networks:
  noxia-network:
    driver: bridge
  # Réseau géré par votre Nginx Proxy Manager Hostinger
  nginx-proxy:
    external: true

volumes:
  postgres_data:
  uploads_data:
